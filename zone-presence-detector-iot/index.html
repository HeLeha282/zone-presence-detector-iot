<!DOCTYPE html>
<html lang="ru">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
   <title>LD2450 Radar - Advanced Visualization</title>
   <style>
      * {
         margin: 0;
         padding: 0;
         box-sizing: border-box;
      }

      body {
         font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
         background: linear-gradient(135deg, #0a0a1a 0%, #0f0f2a 100%);
         min-height: 100vh;
         padding: 20px;
         color: #eee;
      }

      .container {
         max-width: 1600px;
         margin: 0 auto;
      }

      h1 {
         text-align: center;
         margin-bottom: 20px;
         font-size: 2em;
         background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
         -webkit-background-clip: text;
         -webkit-text-fill-color: transparent;
         background-clip: text;
      }

      .status-bar {
         display: flex;
         justify-content: space-between;
         align-items: center;
         background: rgba(0, 0, 0, 0.6);
         padding: 15px 20px;
         border-radius: 10px;
         margin-bottom: 20px;
         flex-wrap: wrap;
         gap: 10px;
         backdrop-filter: blur(10px);
      }

      .connection-status {
         display: flex;
         align-items: center;
         gap: 10px;
      }

      .status-led {
         width: 12px;
         height: 12px;
         border-radius: 50%;
         background: #ff4444;
         transition: all 0.3s;
      }

      .status-led.connected {
         background: #44ff44;
         box-shadow: 0 0 10px #44ff44;
         animation: pulse 2s infinite;
      }

      @keyframes pulse {
         0% {
            box-shadow: 0 0 0 0 rgba(68, 255, 68, 0.4);
         }

         70% {
            box-shadow: 0 0 0 10px rgba(68, 255, 68, 0);
         }

         100% {
            box-shadow: 0 0 0 0 rgba(68, 255, 68, 0);
         }
      }

      .connect-btn {
         background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
         border: none;
         padding: 8px 20px;
         border-radius: 5px;
         color: white;
         cursor: pointer;
         font-size: 14px;
         transition: transform 0.2s, box-shadow 0.2s;
      }

      .connect-btn:hover {
         transform: translateY(-2px);
         box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }

      .connect-btn.disconnect {
         background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      }

      .stats {
         display: flex;
         gap: 20px;
         font-size: 14px;
      }

      .stats div {
         background: rgba(255, 255, 255, 0.1);
         padding: 5px 10px;
         border-radius: 5px;
      }

      .stats span {
         color: #667eea;
         font-weight: bold;
         font-size: 18px;
      }

      .main-grid {
         display: grid;
         grid-template-columns: 1fr 380px;
         gap: 20px;
      }

      .canvas-container {
         background: rgba(0, 0, 0, 0.4);
         border-radius: 15px;
         padding: 20px;
         position: relative;
         box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }

      canvas {
         width: 100%;
         height: auto;
         background: #0a0a1a;
         border-radius: 10px;
         cursor: crosshair;
         display: block;
         box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      }

      .canvas-controls {
         margin-top: 10px;
         display: flex;
         justify-content: center;
         gap: 10px;
         font-size: 12px;
         color: #888;
      }

      .canvas-controls button {
         background: rgba(102, 126, 234, 0.3);
         border: 1px solid #667eea;
         padding: 5px 10px;
         border-radius: 5px;
         color: white;
         cursor: pointer;
         transition: all 0.2s;
      }

      .canvas-controls button:hover {
         background: rgba(102, 126, 234, 0.6);
      }

      .info-panel {
         background: rgba(0, 0, 0, 0.6);
         border-radius: 15px;
         padding: 20px;
         display: flex;
         flex-direction: column;
         gap: 20px;
         backdrop-filter: blur(10px);
      }

      .targets-list {
         background: rgba(255, 255, 255, 0.05);
         border-radius: 10px;
         padding: 15px;
      }

      .targets-list h3,
      .zones-list h3 {
         margin-bottom: 10px;
         color: #667eea;
         font-size: 16px;
         display: flex;
         align-items: center;
         gap: 8px;
      }

      .target-item {
         background: rgba(255, 255, 255, 0.1);
         padding: 12px;
         border-radius: 8px;
         margin-bottom: 8px;
         font-size: 12px;
         font-family: monospace;
         transition: all 0.2s;
         cursor: pointer;
      }

      .target-item:hover {
         background: rgba(255, 255, 255, 0.15);
         transform: translateX(5px);
      }

      .target-item.in-zone {
         border-left: 3px solid #44ff44;
         background: rgba(68, 255, 68, 0.1);
      }

      .target-item.out-zone {
         border-left: 3px solid #ff4444;
      }

      .target-id {
         font-weight: bold;
         color: #667eea;
      }

      .zone-item {
         background: rgba(255, 255, 255, 0.05);
         padding: 12px;
         border-radius: 8px;
         margin-bottom: 8px;
         font-size: 12px;
         cursor: pointer;
         transition: all 0.2s;
      }

      .zone-item:hover {
         background: rgba(255, 255, 255, 0.1);
         transform: translateX(5px);
      }

      .zone-name {
         color: #ffaa44;
         font-weight: bold;
      }

      .raw-data {
         background: rgba(0, 0, 0, 0.6);
         border-radius: 15px;
         margin-top: 20px;
         padding: 15px;
         backdrop-filter: blur(10px);
      }

      .raw-data h3 {
         margin-bottom: 10px;
         font-size: 14px;
         color: #667eea;
      }

      .raw-data pre {
         background: #0a0a1a;
         padding: 10px;
         border-radius: 8px;
         overflow-x: auto;
         font-size: 10px;
         font-family: 'Courier New', monospace;
         max-height: 150px;
         overflow-y: auto;
      }

      @media (max-width: 768px) {
         .main-grid {
            grid-template-columns: 1fr;
         }

         .stats {
            font-size: 11px;
         }
      }

      .coords-tooltip {
         position: fixed;
         background: rgba(0, 0, 0, 0.8);
         border: 1px solid #667eea;
         padding: 5px 10px;
         border-radius: 5px;
         font-size: 11px;
         font-family: monospace;
         pointer-events: none;
         z-index: 1000;
      }
   </style>
</head>

<body>
   <div class="container">
      <h1>📡 LD2450 Radar Monitor</h1>

      <div class="status-bar">
         <div class="connection-status">
            <div class="status-led" id="statusLed"></div>
            <span id="statusText">Disconnected</span>
         </div>
         <button class="connect-btn" id="connectBtn">🔌 Connect to MQTT</button>
         <div class="stats">
            <div>🎯 Targets: <span id="targetCount">0</span></div>
            <div>🟢 In Zones: <span id="inZoneCount">0</span></div>
            <div>📦 Messages: <span id="msgCount">0</span></div>
            <div>📍 Range: <span id="range">-</span></div>
         </div>
      </div>

      <div class="main-grid">
         <div class="canvas-container">
            <canvas id="radarCanvas" width="900" height="700"></canvas>
            <div class="canvas-controls">
               <button id="resetViewBtn">⟳ Reset View</button>
               <button id="zoomInBtn">🔍 Zoom In</button>
               <button id="zoomOutBtn">🔍 Zoom Out</button>
               <span>🖱️ Drag to pan | Scroll to zoom</span>
            </div>
         </div>

         <div class="info-panel">
            <div class="targets-list">
               <h3>🎯 Active Targets</h3>
               <div id="targetsList">No targets detected</div>
            </div>
            <div class="zones-list">
               <h3>🗺️ Zones</h3>
               <div id="zonesList">No zones defined</div>
            </div>
         </div>
      </div>

      <div class="raw-data">
         <h3>📨 Real-time Data</h3>
         <pre id="rawData">Waiting for data...</pre>
      </div>
   </div>

   <script src="https://cdn.jsdelivr.net/npm/mqtt@4.3.7/dist/mqtt.min.js"></script>
   <script>
      // Configuration
      const MQTT_HOST = "104.252.89.123";
      const MQTT_PORT = 9001;
      const MQTT_TOPIC = "assistants/1/ld2450";

      // Global variables
      let client = null;
      let isConnected = false;
      let currentData = { targets: [], zones: [] };
      let messageCount = 0;

      // Canvas references
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');

      // Viewport transformation
      let viewport = {
         offsetX: canvas.width / 2,
         offsetY: canvas.height / 2,
         scale: 0.3,
         dragging: false,
         dragStart: { x: 0, y: 0 }
      };

      // Colors
      const colors = {
         background: '#0a0a1a',
         grid: '#1a1a3a',
         gridLight: '#151530',
         axes: '#ff4444',
         zoneFill: 'rgba(100, 100, 200, 0.2)',
         zoneStroke: '#667eea',
         zoneStrokeHover: '#8b9ef0',
         targetNormal: '#ff4444',
         targetInZone: '#44ff44',
         targetGlow: 'rgba(68, 255, 68, 0.5)',
         targetText: '#ffffff',
         crosshair: '#ffffff',
         label: '#8888aa'
      };

      // Helper: Convert world to canvas coordinates
      function worldToCanvas(x, y) {
         return {
            x: canvas.width / 2 + (x * viewport.scale) + viewport.offsetX,
            y: canvas.height / 2 - (y * viewport.scale) + viewport.offsetY
         };
      }

      // Helper: Convert canvas to world coordinates
      function canvasToWorld(x, y) {
         return {
            x: ((x - canvas.width / 2 - viewport.offsetX) / viewport.scale),
            y: -((y - canvas.height / 2 - viewport.offsetY) / viewport.scale)
         };
      }

      // Draw coordinate axes
      function drawAxes() {
         const origin = worldToCanvas(0, 0);

         // X-axis (horizontal)
         ctx.beginPath();
         ctx.moveTo(0, origin.y);
         ctx.lineTo(canvas.width, origin.y);
         ctx.strokeStyle = colors.axes;
         ctx.lineWidth = 1.5;
         ctx.stroke();

         // Y-axis (vertical)
         ctx.beginPath();
         ctx.moveTo(origin.x, 0);
         ctx.lineTo(origin.x, canvas.height);
         ctx.stroke();

         // Axis arrows
         ctx.fillStyle = colors.axes;
         // X arrow
         ctx.beginPath();
         ctx.moveTo(canvas.width - 10, origin.y - 4);
         ctx.lineTo(canvas.width, origin.y);
         ctx.lineTo(canvas.width - 10, origin.y + 4);
         ctx.fill();
         // Y arrow
         ctx.beginPath();
         ctx.moveTo(origin.x - 4, 10);
         ctx.lineTo(origin.x, 0);
         ctx.lineTo(origin.x + 4, 10);
         ctx.fill();

         // Axis labels
         ctx.fillStyle = colors.label;
         ctx.font = "12px monospace";
         ctx.fillText("X", canvas.width - 15, origin.y - 5);
         ctx.fillText("Y", origin.x + 8, 12);
      }

      // Draw grid with labels
      function drawGrid() {
         ctx.fillStyle = colors.background;
         ctx.fillRect(0, 0, canvas.width, canvas.height);

         // Calculate grid spacing based on scale
         const gridStepWorld = 100; // 100mm step
         const gridStepPx = gridStepWorld * viewport.scale;

         // Find visible range
         const topLeft = canvasToWorld(0, 0);
         const bottomRight = canvasToWorld(canvas.width, canvas.height);

         const startX = Math.floor(topLeft.x / gridStepWorld) * gridStepWorld;
         const startY = Math.floor(bottomRight.y / gridStepWorld) * gridStepWorld;
         const endX = bottomRight.x;
         const endY = topLeft.y;

         // Draw grid lines
         ctx.lineWidth = 1;

         // Vertical lines (X-axis grid)
         for (let x = startX; x <= endX; x += gridStepWorld) {
            const pos = worldToCanvas(x, 0);
            ctx.beginPath();
            ctx.moveTo(pos.x, 0);
            ctx.lineTo(pos.x, canvas.height);
            ctx.strokeStyle = x === 0 ? colors.axes : colors.grid;
            ctx.stroke();

            // Label
            if (x !== 0 && Math.abs(pos.x) < canvas.width + 50) {
               ctx.fillStyle = colors.label;
               ctx.font = "10px monospace";
               ctx.fillText(`${x}`, pos.x - 15, worldToCanvas(0, -50).y);
            }
         }

         // Horizontal lines (Y-axis grid)
         for (let y = startY; y <= endY; y += gridStepWorld) {
            const pos = worldToCanvas(0, y);
            ctx.beginPath();
            ctx.moveTo(0, pos.y);
            ctx.lineTo(canvas.width, pos.y);
            ctx.strokeStyle = y === 0 ? colors.axes : colors.grid;
            ctx.stroke();

            // Label
            if (y !== 0 && Math.abs(pos.y) < canvas.height + 50) {
               ctx.fillStyle = colors.label;
               ctx.font = "10px monospace";
               ctx.fillText(`${y}`, worldToCanvas(50, 0).x, pos.y - 5);
            }
         }

         // Draw concentric circles (radar rings)
         const rings = [500, 1000, 1500, 2000];
         rings.forEach(radius => {
            const center = worldToCanvas(0, 0);
            const radiusPx = radius * viewport.scale;
            if (radiusPx > 0 && radiusPx < Math.max(canvas.width, canvas.height)) {
               ctx.beginPath();
               ctx.arc(center.x, center.y, radiusPx, 0, 2 * Math.PI);
               ctx.strokeStyle = colors.gridLight;
               ctx.lineWidth = 0.5;
               ctx.stroke();

               ctx.fillStyle = colors.label;
               ctx.font = "9px monospace";
               ctx.fillText(`${radius}mm`, center.x + radiusPx + 5, center.y - 5);
            }
         });

         drawAxes();

         // Draw origin label
         const origin = worldToCanvas(0, 0);
         ctx.fillStyle = colors.crosshair;
         ctx.font = "bold 12px monospace";
         ctx.fillText("●", origin.x - 3, origin.y + 4);
         ctx.fillStyle = colors.label;
         ctx.font = "10px monospace";
         ctx.fillText("(0,0)", origin.x + 5, origin.y - 5);
      }

      // Draw zones (polygons)
      function drawZones() {
         if (!currentData.zones) return;

         for (const zone of currentData.zones) {
            if (!zone.vertices || zone.vertices.length < 3) continue;

            // Draw polygon
            ctx.beginPath();
            const firstPoint = worldToCanvas(zone.vertices[0].x, zone.vertices[0].y);
            ctx.moveTo(firstPoint.x, firstPoint.y);

            for (let i = 1; i < zone.vertices.length; i++) {
               const point = worldToCanvas(zone.vertices[i].x, zone.vertices[i].y);
               ctx.lineTo(point.x, point.y);
            }
            ctx.closePath();

            // Fill with semi-transparent color
            ctx.fillStyle = colors.zoneFill;
            ctx.fill();

            // Stroke
            ctx.strokeStyle = colors.zoneStroke;
            ctx.lineWidth = 2;
            ctx.stroke();

            // Draw vertices
            for (const vertex of zone.vertices) {
               const pos = worldToCanvas(vertex.x, vertex.y);
               ctx.beginPath();
               ctx.arc(pos.x, pos.y, 4, 0, 2 * Math.PI);
               ctx.fillStyle = colors.zoneStroke;
               ctx.fill();
               ctx.fillStyle = 'white';
               ctx.font = "10px monospace";
               ctx.fillText(`(${vertex.x},${vertex.y})`, pos.x + 5, pos.y - 5);
            }

            // Draw zone name at centroid
            const centerX = zone.vertices.reduce((sum, p) => sum + p.x, 0) / zone.vertices.length;
            const centerY = zone.vertices.reduce((sum, p) => sum + p.y, 0) / zone.vertices.length;
            const center = worldToCanvas(centerX, centerY);

            ctx.fillStyle = colors.zoneStroke;
            ctx.font = "bold 14px monospace";
            ctx.shadowBlur = 5;
            ctx.shadowColor = "black";
            ctx.fillText(zone.name, center.x - 30, center.y - 10);
            ctx.shadowBlur = 0;
         }
      }

      // Draw targets (people)
      function drawTargets() {
         if (!currentData.targets) return;

         for (const target of currentData.targets) {
            const pos = worldToCanvas(target.x, target.y);

            // Glow effect for targets in zone
            if (target.inZone) {
               ctx.shadowBlur = 15;
               ctx.shadowColor = colors.targetGlow;
            }

            // Outer ring
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 12, 0, 2 * Math.PI);
            ctx.fillStyle = target.inZone ? colors.targetInZone : colors.targetNormal;
            ctx.fill();
            ctx.globalAlpha = 0.3;
            ctx.fill();
            ctx.globalAlpha = 1;

            // Inner circle
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 7, 0, 2 * Math.PI);
            ctx.fillStyle = target.inZone ? '#22aa22' : '#aa2222';
            ctx.fill();

            // Center dot
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 3, 0, 2 * Math.PI);
            ctx.fillStyle = 'white';
            ctx.fill();

            ctx.shadowBlur = 0;

            // Draw line from origin to target
            const origin = worldToCanvas(0, 0);
            ctx.beginPath();
            ctx.moveTo(origin.x, origin.y);
            ctx.lineTo(pos.x, pos.y);
            ctx.strokeStyle = target.inZone ? colors.targetInZone : colors.targetNormal;
            ctx.lineWidth = 1.5;
            ctx.setLineDash([8, 6]);
            ctx.stroke();
            ctx.setLineDash([]);

            // Target info label
            ctx.fillStyle = colors.targetText;
            ctx.font = "bold 11px monospace";
            ctx.fillText(`#${target.id}`, pos.x - 8, pos.y - 12);
            ctx.font = "10px monospace";
            ctx.fillText(`(${target.x},${target.y})`, pos.x - 25, pos.y - 25);
            if (target.speed !== undefined && target.speed > 0) {
               ctx.fillStyle = '#ffaa44';
               ctx.fillText(`⚡${target.speed}`, pos.x - 10, pos.y + 20);
            }

            // Status indicator
            if (target.inZone) {
               ctx.fillStyle = colors.targetInZone;
               ctx.font = "12px monospace";
               ctx.fillText("✓", pos.x + 10, pos.y - 8);
            }
         }
      }

      // Draw radar sweep effect
      let sweepAngle = 0;
      function drawRadarSweep() {
         const origin = worldToCanvas(0, 0);
         const radius = Math.max(canvas.width, canvas.height) * 1.5;

         sweepAngle += 0.02;
         if (sweepAngle > 2 * Math.PI) sweepAngle -= 2 * Math.PI;

         ctx.beginPath();
         ctx.moveTo(origin.x, origin.y);
         ctx.arc(origin.x, origin.y, radius, sweepAngle - 0.1, sweepAngle);
         ctx.fillStyle = 'rgba(68, 255, 68, 0.03)';
         ctx.fill();
      }

      // Render everything
      function render() {
         drawGrid();
         drawZones();
         drawTargets();
         drawRadarSweep();
      }

      // Update UI with current data
      function updateUI() {
         // Update targets list
         const targetsDiv = document.getElementById('targetsList');
         if (currentData.targets.length === 0) {
            targetsDiv.innerHTML = '<div style="text-align: center; padding: 20px; color: #888;">No targets detected</div>';
         } else {
            targetsDiv.innerHTML = currentData.targets.map(t => `
                    <div class="target-item ${t.inZone ? 'in-zone' : 'out-zone'}">
                        <div><span class="target-id">Target ${t.id}</span> ${t.inZone ? '✅ IN ZONE' : '❌ Not in zone'}</div>
                        <div>📍 Position: X=${t.x} mm, Y=${t.y} mm</div>
                        <div>⚡ Speed: ${t.speed || 0} mm/s</div>
                        <div>📐 Distance: ${Math.sqrt(t.x * t.x + t.y * t.y).toFixed(0)} mm</div>
                    </div>
                `).join('');
         }

         // Update zones list
         const zonesDiv = document.getElementById('zonesList');
         if (!currentData.zones || currentData.zones.length === 0) {
            zonesDiv.innerHTML = '<div style="text-align: center; padding: 20px; color: #888;">No zones defined</div>';
         } else {
            zonesDiv.innerHTML = currentData.zones.map(z => {
               const area = calculatePolygonArea(z.vertices);
               return `
                        <div class="zone-item">
                            <div><span class="zone-name">${z.name}</span></div>
                            <div>📍 Vertices: ${z.vertices?.length || 0}</div>
                            <div>📐 Area: ${area} mm²</div>
                        </div>
                    `;
            }).join('');
         }

         // Update stats
         document.getElementById('targetCount').textContent = currentData.targets.length;
         document.getElementById('inZoneCount').textContent = currentData.targets.filter(t => t.inZone).length;

         if (currentData.targets.length > 0) {
            const maxDist = Math.max(...currentData.targets.map(t => Math.sqrt(t.x * t.x + t.y * t.y)));
            document.getElementById('range').textContent = `${maxDist.toFixed(0)} mm`;
         } else {
            document.getElementById('range').textContent = '-';
         }
      }

      // Calculate polygon area
      function calculatePolygonArea(vertices) {
         if (!vertices || vertices.length < 3) return 0;
         let area = 0;
         for (let i = 0; i < vertices.length; i++) {
            const j = (i + 1) % vertices.length;
            area += vertices[i].x * vertices[j].y;
            area -= vertices[j].x * vertices[i].y;
         }
         return Math.abs(area / 2).toFixed(0);
      }

      // Process incoming MQTT message
      function processMessage(message) {
         try {
            const data = JSON.parse(message);
            currentData = {
               targets: data.targets || [],
               zones: data.zones || []
            };
            messageCount++;
            render();
            updateUI();

            // Update raw data display
            const rawDiv = document.getElementById('rawData');
            rawDiv.textContent = JSON.stringify(data, null, 2);
            rawDiv.scrollTop = rawDiv.scrollHeight;
         } catch (e) {
            console.error('Failed to parse JSON:', e);
            document.getElementById('rawData').textContent = `Error: ${e.message}\n\nRaw: ${message}`;
         }
      }

      // MQTT Connection
      function connectMQTT() {
         if (client && isConnected) {
            client.end();
            return;
         }

         const broker = `ws://${MQTT_HOST}:${MQTT_PORT}`;
         console.log(`Connecting to ${broker}...`);

         const connectBtn = document.getElementById('connectBtn');
         connectBtn.textContent = '🔄 Connecting...';
         connectBtn.disabled = true;

         client = mqtt.connect(broker, {
            clientId: 'web_radar_' + Math.random().toString(36).substr(2, 8),
            clean: true,
            connectTimeout: 5000,
            reconnectPeriod: 3000
         });

         client.on('connect', () => {
            console.log('✅ Connected to MQTT broker!');
            isConnected = true;
            document.getElementById('statusLed').classList.add('connected');
            document.getElementById('statusText').innerHTML = '✅ Connected on port 9001';
            connectBtn.textContent = '🔌 Disconnect';
            connectBtn.classList.add('disconnect');
            connectBtn.disabled = false;
            client.subscribe(MQTT_TOPIC, (err) => {
               if (!err) console.log(`Subscribed to ${MQTT_TOPIC}`);
            });
         });

         client.on('message', (topic, payload) => {
            if (topic === MQTT_TOPIC) {
               processMessage(payload.toString());
            }
         });

         client.on('error', (err) => {
            console.error('MQTT Error:', err);
            updateConnectionStatus(false);
         });

         client.on('close', () => {
            console.log('MQTT connection closed');
            updateConnectionStatus(false);
         });
      }

      function updateConnectionStatus(connected) {
         isConnected = connected;
         const statusLed = document.getElementById('statusLed');
         const statusText = document.getElementById('statusText');
         const connectBtn = document.getElementById('connectBtn');

         if (connected) {
            statusLed.classList.add('connected');
            statusText.innerHTML = '✅ Connected on port 9001';
            connectBtn.textContent = '🔌 Disconnect';
            connectBtn.classList.add('disconnect');
         } else {
            statusLed.classList.remove('connected');
            statusText.innerHTML = '❌ Disconnected';
            connectBtn.textContent = '🔌 Connect to MQTT';
            connectBtn.classList.remove('disconnect');
         }
         connectBtn.disabled = false;
      }

      // Canvas interaction handlers
      function resetView() {
         viewport = {
            offsetX: 0,
            offsetY: 0,
            scale: 0.3,
            dragging: false,
            dragStart: { x: 0, y: 0 }
         };
         render();
      }

      function zoomIn() {
         viewport.scale = Math.min(viewport.scale * 1.2, 2);
         render();
      }

      function zoomOut() {
         viewport.scale = Math.max(viewport.scale * 0.8, 0.1);
         render();
      }

      function handleMouseDown(e) {
         const rect = canvas.getBoundingClientRect();
         const mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
         const mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
         viewport.dragging = true;
         viewport.dragStart = { x: mouseX - viewport.offsetX, y: mouseY - viewport.offsetY };
         canvas.style.cursor = 'grabbing';
      }

      function handleMouseMove(e) {
         if (!viewport.dragging) return;
         const rect = canvas.getBoundingClientRect();
         const mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
         const mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
         viewport.offsetX = mouseX - viewport.dragStart.x;
         viewport.offsetY = mouseY - viewport.dragStart.y;
         render();
      }

      function handleMouseUp() {
         viewport.dragging = false;
         canvas.style.cursor = 'crosshair';
      }

      function handleWheel(e) {
         e.preventDefault();
         const rect = canvas.getBoundingClientRect();
         const mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
         const mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);

         const worldBefore = canvasToWorld(mouseX, mouseY);
         const delta = e.deltaY > 0 ? 0.9 : 1.1;
         const newScale = viewport.scale * delta;

         if (newScale >= 0.1 && newScale <= 2) {
            viewport.scale = newScale;
            const worldAfter = canvasToWorld(mouseX, mouseY);
            viewport.offsetX += (worldAfter.x - worldBefore.x) * viewport.scale;
            viewport.offsetY -= (worldAfter.y - worldBefore.y) * viewport.scale;
            render();
         }
      }

      function handleClick(e) {
         const rect = canvas.getBoundingClientRect();
         const mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
         const mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
         const worldPos = canvasToWorld(mouseX, mouseY);

         // Show temporary tooltip
         const tooltip = document.createElement('div');
         tooltip.className = 'coords-tooltip';
         tooltip.innerHTML = `📍 (${worldPos.x.toFixed(0)}, ${worldPos.y.toFixed(0)})`;
         tooltip.style.left = e.clientX + 15 + 'px';
         tooltip.style.top = e.clientY - 30 + 'px';
         document.body.appendChild(tooltip);
         setTimeout(() => tooltip.remove(), 2000);
      }

      // Setup event listeners
      function setupEventListeners() {
         canvas.addEventListener('mousedown', handleMouseDown);
         window.addEventListener('mousemove', handleMouseMove);
         window.addEventListener('mouseup', handleMouseUp);
         canvas.addEventListener('wheel', handleWheel);
         canvas.addEventListener('click', handleClick);
         document.getElementById('connectBtn').addEventListener('click', connectMQTT);
         document.getElementById('resetViewBtn').addEventListener('click', resetView);
         document.getElementById('zoomInBtn').addEventListener('click', zoomIn);
         document.getElementById('zoomOutBtn').addEventListener('click', zoomOut);
      }

      // Initialize
      function init() {
         setupEventListeners();
         resetView();
         // Auto-connect after 1 second
         setTimeout(() => connectMQTT(), 1000);
      }

      // Start the app
      init();
   </script>
</body>
