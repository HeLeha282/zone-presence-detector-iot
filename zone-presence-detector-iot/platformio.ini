#https://github.com/platformio/platform-espressif32/blob/develop/boards/freenove_esp32_s3_wroom.json конфигурация этой платы

[env:freenove_esp32_s3_wroom]
platform = espressif32@6.6.0
board = esp32-s3-devkitc-1
framework = arduino

lib_ldf_mode = deep+

board_build.filesystem = littlefs

; === ФЛАГИ КОМПИЛЯЦИИ (из "extra_flags") ===
build_flags = 
    -DCONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=1
    -mfix-esp32-psram-cache-issue
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCONFIG_FREERTOS_GENERATE_RUN_TIME_STATS=1
    -DCONFIG_FREERTOS_USE_TRACE_FACILITY=1
    -DCONFIG_FREERTOS_USE_STATS_FORMATTING_FUNCTIONS=1
    -DCONFIG_ESP32_TIME_SYSCALL=0
    -D configUSE_TRACE_FACILITY=1
    -D configUSE_STATS_FORMATTING_FUNCTIONS=1
    ; -D MQTT_MAX_PACKET_SIZE=1024

monitor_speed = 115200
; === НАСТРОЙКИ ЗАГРУЗКИ (из секции "upload") ===
upload_speed = 921600

board_build.arduino.memory_type = qio_opi
; === ПАМЯТЬ И ФЛЕШ ===
board_upload.flash_size = 16MB        ; Реальный объём флеш-памяти
board_build.flash_mode = qio          ; Quad I/O (стандарт для большинства плат)
board_build.f_flash = 80000000L       ; Частота флеш: 80 МГцpio run -t erase s
board_build.partitions = defaul2t_16MB.csv  ; Схема партицирования под 16МБ

; === PSRAM (критично для ESP32-S3!) ===
; board_build.psram_type = opi          ; OPI PSRAM для большинства плат S3 - УСТАНОВЛЕНО ПО ДЕФОЛТУ
board_upload.maximum_ram_size = 327680  ; 320 KB внутренней RAM


lib_deps = 
    # earlephilhower/ESP8266Audio @ 1.9.7
    https://github.com/knolleary/pubsubclient.git
    https://github.com/bblanchon/ArduinoJson.git
   ; https://github.com/pschatzmann/ESP32-A2DP.git
